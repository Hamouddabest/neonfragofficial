name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --include=dev --legacy-peer-deps

      - name: Build Web Assets
        run: |
          npm install vite --save-dev --legacy-peer-deps
          npm run build --if-present

      - name: Sync Capacitor iOS
        run: |
          npm install @capacitor/cli --save-dev --legacy-peer-deps
          npx cap add ios
          npx cap sync ios




      - name: Build Xcode Workspace
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -configuration Debug \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     ARCHS=arm64 \
                     clean build
                     
      - name: Create Unsigned IPA
        run: |
          mkdir -p build/Payload
          mv ios/App/build/Debug-iphoneos/App.app build/Payload/
          cd build && zip -r App.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-ipa
          path: build/App.ipa
